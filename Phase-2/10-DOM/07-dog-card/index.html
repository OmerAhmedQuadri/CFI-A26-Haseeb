<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawg</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.8.0/axios.min.js"
        integrity="sha512-Rjx/Bee5UEvuxMc3Au6ShLf08nh+v4q3sNCI/+pSzypORWeVZG5jRZBKxM6RlA7L4hbHykwFXhmlBu/cJBaDRg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="image-container">
            <img id="image" src="#" alt="dog-image">
        </div>
        <h3 id="dog-name">Somedawg</h3>
        <div id="dog-info">
            <ul>

                <li><strong>Breed: </strong>
                    <p id="breed">some-breed</p>
                </li>
                <li><strong>Bred For: </strong>
                    <p id="bred-for-text">some bred</p>
                </li>
                <li><strong>Life Span: </strong>
                    <p id="life-span">sum years</p>
                </li>
                <li><strong>Temperament: </strong>
                    <p id="temperament">some-temp</p>
                </li>
                <li><strong>Height: </strong>
                    <p id="height">some-height</p>
                </li>
                <li><strong>Weight: </strong>
                    <p id="weight">some-weight</p>
                </li>
            </ul>

        </div>
        <button id="dog-btn">Get Random Dog</button>
    </div>
</body>
<script src="script.js"></script>

</html>
